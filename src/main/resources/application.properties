spring.application.name=service-shop-management
server.port=${PORT:80}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Database timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Logging
logging.level.org.springframework=INFO
logging.level.com.shop.service_shop_management=DEBUG
# Twilio WhatsApp Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM}

# WhatsApp approved template IDs
twilio.template.received=${TWILIO_TEMPLATE_RECEIVED}
twilio.template.ready=${TWILIO_TEMPLATE_READY}
twilio.template.delivered=${TWILIO_TEMPLATE_DELIVERED}
